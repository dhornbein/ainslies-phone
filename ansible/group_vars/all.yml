---
# SSH Key on Dev system
local_home: /home/drew
ssh_key: "{{ local_home }}/.ssh/id_pi5_ainsile_phone"

# Network configuration
pi_static_ip: "192.168.50.10"
pi_netmask: "255.255.255.0"
ht801_ip: "192.168.50.20"

# HT801 Auto-provisioning
ht801_admin_password: "Phone2Pi"
ht801_sip_user: "ht801-aor"

# Project paths
project_user: "drew"
project_home: "/home/{{ project_user }}"
deploy_path: "{{ project_home }}/ainslie-phone"

# System packages
base_packages:
  - git
  - python3
  - python3-pip
  - python3-venv
  - build-essential
  - vim
  - nano
  - htop
  - screen
  - tmux
  - net-tools
  - curl
  - wget

# Asterisk source installation
asterisk_version: "18"
asterisk_tarball: "asterisk-{{ asterisk_version }}-current.tar.gz"
asterisk_download_url: "https://downloads.asterisk.org/pub/telephony/asterisk/{{ asterisk_tarball }}"
asterisk_source_dir: "asterisk-{{ asterisk_version }}.*"  # Will match extracted directory

# Disable native architecture optimization for VMs (set to true if needed)
disable_build_native: false
