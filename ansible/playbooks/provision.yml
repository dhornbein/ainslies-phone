---
- name: Provision Raspberry Pi for Ainslie Phone
  hosts: all
  become: true
  vars_files:
    - ../group_vars/all.yml
  
  tasks:
    - name: Update apt cache
      tags: update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        
    - name: Upgrade all packages
      tags: update
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
        
    - name: Install base packages
      tags: install
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        
    - name: Create project directories
      tags: copy
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0755'
      loop:
        - "{{ deploy_path }}"

    - name: Deploy project files from local relative path
      tags: copy
      ansible.builtin.copy:
        src: "../"
        dest: "{{ deploy_path }}/"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0644'
        remote_src: no
