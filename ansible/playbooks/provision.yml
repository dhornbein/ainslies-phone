---
- name: Setup Raspberry Pi Network
  ansible.builtin.import_playbook: network-setup.yml

- name: Provision Raspberry Pi for Ainslie Phone
  hosts: all
  become: true
  vars_files:
    - ../group_vars/all.yml
  handlers:
    - import_tasks: ../handlers/main.yml
  
  tasks:
    - name: Update apt cache
      tags: update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        
    - name: Upgrade all packages
      tags: update
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
        
    - name: Install base packages
      tags: install
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        
    - name: Ensure Asterisk service is enabled
      tags: service
      ansible.builtin.systemd:
        name: asterisk
        enabled: yes
        state: started
      failed_when: false  # May not be installed yet

    - name: Create asterisk symlink in user home
      tags: home_setup
      ansible.builtin.file:
        src: /etc/asterisk
        dest: "{{ project_home }}/asterisk"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        state: link

    - name: Create extensions.conf symlink in user home
      tags: home_setup
      ansible.builtin.file:
        src: "{{ project_home }}/asterisk/extensions.conf"
        dest: "{{ project_home }}/extensions.conf"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        state: link

    - name: Create pjsip.conf symlink in user home
      tags: home_setup
      ansible.builtin.file:
        src: "{{ project_home }}/asterisk/pjsip.conf"
        dest: "{{ project_home }}/pjsip.conf"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        state: link

    - name: Create sounds symlink in user home
      tags: home_setup
      ansible.builtin.file:
        src: /var/lib/asterisk/sounds
        dest: "{{ project_home }}/sounds"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        state: link

    - name: Create status.sh script in user home
      tags: home_setup
      ansible.builtin.template:
        src: ../templates/status.sh.j2
        dest: "{{ project_home }}/status.sh"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0755'

    - name: Create recovery_script.sh in user home
      tags: home_setup
      ansible.builtin.template:
        src: ../templates/recovery_script.sh.j2
        dest: "{{ project_home }}/recovery_script.sh"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0755'

    - name: Create random_ring.sh script in user home
      tags: home_setup
      ansible.builtin.template:
        src: ../templates/random_ring.sh.j2
        dest: "{{ project_home }}/random_ring.sh"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0755'

    - name: Provision complete
      ansible.builtin.debug:
        msg: |
          ✅ Provisioning complete!
          
          Next steps:
          1. Install Asterisk: ansible-playbook playbooks/install-asterisk.yml
          2. Configure HT801: ansible-playbook playbooks/ht801-setup.yml
          3. Deploy configs: ansible-playbook playbooks/update.yml
