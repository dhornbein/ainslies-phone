---
- name: Setup Raspberry Pi Network
  ansible.builtin.import_playbook: network-setup.yml

- name: Provision Raspberry Pi for Ainslie Phone
  hosts: all
  become: true
  vars_files:
    - ../group_vars/all.yml
  handlers:
    - import_tasks: ../handlers/main.yml
  
  tasks:
    - name: Update apt cache
      tags: update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        
    - name: Upgrade all packages
      tags: update
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
        
    - name: Install base packages
      tags: install
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        
    - name: Create project directories
      tags: copy
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0755'
      loop:
        - "{{ deploy_path }}"

    - name: Deploy project files from local relative path
      tags: copy
      ansible.builtin.copy:
        src: "../../"
        dest: "{{ deploy_path }}/"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0644'
        remote_src: no

    - name: Ensure Asterisk service is enabled
      tags: service
      ansible.builtin.systemd:
        name: asterisk
        enabled: yes
        state: started
      failed_when: false  # May not be installed yet

    - name: Provision complete
      ansible.builtin.debug:
        msg: |
          ✅ Provisioning complete!
          
          Next steps:
          1. Install Asterisk: ansible-playbook playbooks/install-asterisk.yml
          2. Configure HT801: ansible-playbook playbooks/ht801-setup.yml
          3. Deploy configs: ansible-playbook playbooks/update.yml
