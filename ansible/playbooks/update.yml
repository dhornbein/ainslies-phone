---
- name: Update Ainslie Phone deployment
  hosts: all
  become: true
  vars_files:
    - ../group_vars/all.yml
  handlers:
    - import_tasks: ../handlers/main.yml
  
  tasks:

    - name: Run local audio conversion (idempotent)
      delegate_to: localhost
      become: false
      args:
        chdir: "{{ playbook_dir }}/../../source-audio"
      ansible.builtin.shell: |
        bash ./convert_audio.sh
      tags: [deploy, audio]

    - name: Sync audio files to Asterisk sounds directory
      ansible.posix.synchronize:
        src: ../../sounds/
        dest: /var/lib/asterisk/sounds/ainslie/
        delete: yes # This will delete files on the destination that don't exist locally
        rsync_opts:
          - "--chown=asterisk:asterisk"
      tags: deploy, audio

    - name: Deploy pjsip.conf configuration
      ansible.builtin.template:
        src: "../templates/pjsip.conf.j2"
        dest: "/etc/asterisk/pjsip.conf"
        owner: asterisk
        group: asterisk
        mode: '0644'
        backup: yes
      notify: Reload Asterisk PJSIP
      tags: asterisk_config

    - name: Deploy extensions.conf configuration  
      ansible.builtin.template:
        src: "../templates/extensions.conf.j2"
        dest: "/etc/asterisk/extensions.conf"
        owner: asterisk
        group: asterisk
        mode: '0644'
        backup: yes
      notify: Reload Asterisk Dialplan
      tags: asterisk_config

    - name: Verify Asterisk service is running
      ansible.builtin.systemd:
        name: asterisk
        state: started
        enabled: yes
      tags: asterisk_service

    - name: Check Asterisk SIP endpoint status
      ansible.builtin.command: asterisk -rx "pjsip show endpoints"
      register: sip_status
      changed_when: false
      failed_when: false
      tags: asterisk_verify

    - name: Display SIP endpoint status
      ansible.builtin.debug:
        msg: "SIP Endpoints: {{ sip_status.stdout_lines }}"
      when: sip_status.rc == 0
      tags: asterisk_verify
      
    - name: Deployment complete
      ansible.builtin.debug:
        msg: "Audio and configuration deployment complete at {{ ansible_date_time.iso8601 }}"
